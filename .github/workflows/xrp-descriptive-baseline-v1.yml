name: XRP Descriptive Baseline V1

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/xrp-descriptive-baseline-v1.yml"

jobs:
  partial:
    strategy:
      fail-fast: false
      matrix:
        include:
          - year: "2020"
            norm_start: "2020-01"
            norm_end: "2020-12"
            target_start: "2020-02-01T00:00:00Z"
            target_end: "2021-01-01T00:00:00Z"
          - year: "2021"
            norm_start: "2020-12"
            norm_end: "2021-12"
            target_start: "2021-01-01T00:00:00Z"
            target_end: "2022-01-01T00:00:00Z"
          - year: "2022"
            norm_start: "2021-12"
            norm_end: "2022-12"
            target_start: "2022-01-01T00:00:00Z"
            target_end: "2023-01-01T00:00:00Z"
          - year: "2023"
            norm_start: "2022-12"
            norm_end: "2023-12"
            target_start: "2023-01-01T00:00:00Z"
            target_end: "2024-01-01T00:00:00Z"
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Normalize continuous window
        run: |
          python research/historical_normalizer_window_v1.py \
            --start-month "${{ matrix.norm_start }}" \
            --end-month "${{ matrix.norm_end }}" \
            --outdir norm-window

      - name: Build descriptive partial
        run: |
          DB=$(find norm-window -name '*.sqlite' -type f | head -1)
          test -n "$DB"
          python research/historical_descriptive_baseline_part_v1.py \
            --db "$DB" \
            --target-start "${{ matrix.target_start }}" \
            --target-end "${{ matrix.target_end }}" \
            --outdir baseline-part

      - name: Remove large temporary database
        if: always()
        run: rm -f norm-window/*.sqlite norm-window/*.sqlite-wal norm-window/*.sqlite-shm

      - name: Upload partial baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-part-${{ matrix.year }}
          path: |
            baseline-part/
            norm-window/WINDOW_NORMALIZATION_QC.json
          if-no-files-found: warn

  aggregate:
    needs: partial
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download partial reports
        uses: actions/download-artifact@v4
        with:
          pattern: baseline-part-*
          path: parts

      - name: Aggregate baseline
        run: |
          python research/historical_descriptive_baseline_aggregate_v1.py \
            --root parts \
            --outdir baseline-final

      - name: Upload final baseline
        uses: actions/upload-artifact@v4
        with:
          name: xrp-descriptive-baseline-v1
          path: baseline-final/
