name: XRP Outcome Engine Smoke V1
# rerun: 3

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/xrp-outcome-engine-smoke-v1.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Normalize warmup plus future buffer
        run: |
          python research/historical_normalizer_window_v1.py \
            --start-month "2020-01" \
            --end-month "2020-02" \
            --outdir norm-output

      - name: Build FEATURES_V1 decision rows
        run: |
          DB=$(find norm-output -name '*.sqlite' -type f | head -1)
          test -n "$DB"
          python research/historical_feature_builder_v1.py \
            --db "$DB" \
            --outdir feature-output

      - name: Run OUTCOMES_V1 pass A
        run: |
          DB=$(find norm-output -name '*.sqlite' -type f | head -1)
          python research/historical_outcome_engine_v1.py \
            --db "$DB" \
            --features feature-output/XRP_FEATURES_V1.csv \
            --target-start "2020-01-06T08:21:00Z" \
            --target-end "2020-02-01T00:00:00Z" \
            --outdir outcome-a

      - name: Run OUTCOMES_V1 pass B
        run: |
          DB=$(find norm-output -name '*.sqlite' -type f | head -1)
          python research/historical_outcome_engine_v1.py \
            --db "$DB" \
            --features feature-output/XRP_FEATURES_V1.csv \
            --target-start "2020-01-06T08:21:00Z" \
            --target-end "2020-02-01T00:00:00Z" \
            --outdir outcome-b

      - name: Determinism check
        run: |
          cmp outcome-a/XRP_OUTCOMES_V1.csv outcome-b/XRP_OUTCOMES_V1.csv
          SHA_A=$(sha256sum outcome-a/XRP_OUTCOMES_V1.csv | awk '{print $1}')
          SHA_B=$(sha256sum outcome-b/XRP_OUTCOMES_V1.csv | awk '{print $1}')
          echo "outcome_sha_a=$SHA_A"
          echo "outcome_sha_b=$SHA_B"
          test "$SHA_A" = "$SHA_B"
          printf '%s\n' "$SHA_A" > outcome-a/XRP_OUTCOMES_V1_FILE_SHA256.txt

      - name: Remove raw outcome and large intermediate data before upload
        if: always()
        run: |
          rm -f outcome-a/XRP_OUTCOMES_V1.csv outcome-b/XRP_OUTCOMES_V1.csv
          rm -f feature-output/XRP_FEATURES_V1.csv
          rm -f norm-output/*.sqlite norm-output/*.sqlite-wal norm-output/*.sqlite-shm

      - name: Upload QA only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xrp-outcome-engine-smoke-v1
          path: |
            outcome-a/
            norm-output/WINDOW_NORMALIZATION_QC.json
            feature-output/XRP_FEATURES_V1_QC.json
            feature-output/XRP_FEATURES_V1_QC.md
          if-no-files-found: warn
