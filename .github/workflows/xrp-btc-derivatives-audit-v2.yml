name: XRP BTC Derivatives Audit V2

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/xrp-btc-derivatives-audit-v2.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run S3-indexed derivatives audit
        run: python research/historical_derivatives_audit_v2.py
      - name: Upload derivatives audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xrp-btc-derivatives-audit-v2
          path: audit-output/
          if-no-files-found: warn
