name: SOLV V3.4 smoke

on:
  push:
    paths:
      - "agents/SOLV_V3_4_MASTER.txt"
      - "apps-script/SOLV_Receptor_Incremental.gs"
      - "termux/analysis_tracker.py"
      - "termux/test_analysis_tracker_execution.py"
      - "termux/test_analysis_tracker_solv_v34.py"
      - "research/SOLV_SYSTEM_STATUS.md"
      - "research/SOLV_FORWARD_V3_4_R1_PREREGISTRATION.md"
      - "research/SOLV_V3_4_DEPLOYMENT_GATE_R1.md"
      - "research/SOLV_V3_4_FORWARD_PROTOCOL.md"
      - "research/SOLV_V3_4_ACTIVATION_CHECKLIST.md"
      - "README.md"
      - ".github/workflows/solv-v3-4-smoke.yml"
  pull_request:
    paths:
      - "agents/SOLV_V3_4_MASTER.txt"
      - "apps-script/SOLV_Receptor_Incremental.gs"
      - "termux/analysis_tracker.py"
      - "termux/test_analysis_tracker_execution.py"
      - "termux/test_analysis_tracker_solv_v34.py"
      - "research/SOLV_SYSTEM_STATUS.md"
      - "research/SOLV_FORWARD_V3_4_R1_PREREGISTRATION.md"
      - "research/SOLV_V3_4_DEPLOYMENT_GATE_R1.md"
      - "research/SOLV_V3_4_FORWARD_PROTOCOL.md"
      - "research/SOLV_V3_4_ACTIVATION_CHECKLIST.md"
      - "README.md"
      - ".github/workflows/solv-v3-4-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python execution audit tests
        run: |
          cd termux
          python -m unittest -v test_analysis_tracker_execution.py test_analysis_tracker_solv_v34.py
      - name: Apps Script syntax check
        run: |
          cp apps-script/SOLV_Receptor_Incremental.gs /tmp/SOLV_Receptor_Incremental.js
          node --check /tmp/SOLV_Receptor_Incremental.js

      - name: SOLV receptor ingestion allowlist security tests
        run: |
          cp apps-script/SOLV_Receptor_Incremental.gs /tmp/SOLV_Receptor_Allowlist_Test.js
          cat >> /tmp/SOLV_Receptor_Allowlist_Test.js <<'JS'
          function expectThrows_(fn, marker) {
            let threw = false;
            try { fn(); } catch (err) {
              threw = true;
              if (marker && String(err).indexOf(marker) === -1) throw err;
            }
            if (!threw) throw new Error('Expected rejection: ' + marker);
          }
          const row11 = Array(11).fill('x');
          validateIncomingSheets_('bootstrap', {'SOLV_1M':[row11]});
          validateIncomingSheets_('incremental', {'ALERT_RESEARCH':[row11]});
          expectThrows_(function(){ validateIncomingSheets_('bootstrap', {'ALERT_RESEARCH':[row11]}); }, 'SHEET_NOT_ALLOWED');
          expectThrows_(function(){ validateIncomingSheets_('incremental', {'SIGNALS':[row11]}); }, 'SHEET_NOT_ALLOWED');
          expectThrows_(function(){ validateIncomingSheets_('incremental', {'ANALYSES':[row11]}); }, 'SHEET_NOT_ALLOWED');
          expectThrows_(function(){ validateIncomingSheets_('incremental', {'USER_TRADES':[row11]}); }, 'SHEET_NOT_ALLOWED');
          expectThrows_(function(){ validateIncomingSheets_('incremental', {'PERFORMANCE':[row11]}); }, 'SHEET_NOT_ALLOWED');
          expectThrows_(function(){ validateIncomingSheets_('incremental', {'BACKFILL_QUEUE':[row11]}); }, 'SHEET_NOT_ALLOWED');
          expectThrows_(function(){ validateIncomingSheets_('incremental', {'SOLV_1M':[['bad-width']]}); }, 'ROW_WIDTH_INVALID');
          console.log('PASS SOLV_RECEPTOR_INGESTION_ALLOWLIST');
          JS
          node /tmp/SOLV_Receptor_Allowlist_Test.js
      - name: V3.4 rule markers
        run: |
          grep -q "LONG = SHADOW/RESEARCH ONLY" agents/SOLV_V3_4_MASTER.txt
          grep -q "SHORT = SHORT_EXPERIMENTAL" agents/SOLV_V3_4_MASTER.txt
          grep -q "SOLV_TP1_1R_R1" agents/SOLV_V3_4_MASTER.txt
          grep -q "SOLV_V3_4_SCHEMA_EC_AQ_V1" apps-script/SOLV_Receptor_Incremental.gs
          grep -q "SOLV_RECEPTOR_V3_4_V2" apps-script/SOLV_Receptor_Incremental.gs
          grep -q "SOLV_FORWARD_V3_4_R1" research/SOLV_FORWARD_V3_4_R1_PREREGISTRATION.md
          grep -q "2026-10-05T06:00:00Z" research/SOLV_FORWARD_V3_4_R1_PREREGISTRATION.md
          grep -q "PRELAUNCH_FROZEN" research/SOLV_SYSTEM_STATUS.md
