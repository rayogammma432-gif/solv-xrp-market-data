name: Seal XRP Forward V3

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/seal-xrp-forward-v3.yml"

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate forward-only registry and holdout lock
        run: python research/validate_xrp_forward_v3.py
      - name: Upload seal
        uses: actions/upload-artifact@v4
        with:
          name: xrp-forward-v3-seal
          path: forward-v3-seal/
