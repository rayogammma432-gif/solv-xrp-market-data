name: XRP V3.4 preactivation gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'agents/XRP_V3_4_MASTER.txt'
      - 'apps-script/XRP_Receptor_V3_4.gs'
      - 'termux/analysis_tracker.py'
      - 'termux/test_analysis_tracker_execution.py'
      - 'research/XRP_V3_4_EXECUTION_QUALITY.md'
      - '.github/workflows/xrp-v3-4-preactivation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preactivation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python
        run: |
          python -m py_compile termux/analysis_tracker.py
          python -m py_compile termux/market_collector.py
          python -m py_compile termux/signal_tracker.py

      - name: Execution-audit unit tests
        working-directory: termux
        run: python -m unittest -v test_analysis_tracker_execution.py

      - name: Existing forward tracker regression tests
        working-directory: termux
        env:
          PYTHONPATH: .:../research
        run: python test_forward_v3_tracker.py

      - name: Receptor JavaScript syntax
        run: |
          cp apps-script/XRP_Receptor_V3_4.gs /tmp/XRP_Receptor_Incremental.js
          node --check /tmp/XRP_Receptor_Incremental.js

      - name: V3.4 schema contract
        run: |
          python - <<'PY'
          from pathlib import Path

          receptor = Path("apps-script/XRP_Receptor_V3_4.gs").read_text()
          rules = Path("agents/XRP_V3_4_MASTER.txt").read_text()
          tracker = Path("termux/analysis_tracker.py").read_text()

          required_receptor = [
              "const SIGNAL_COLS = 43;",
              "const ANALYSIS_COLS = 129;",
              "const planRange = sh.getRange(row, 118, 1, 2); // DN:DO",
              "const execRange = sh.getRange(row, 121, 1, 8); // DQ:DX",
              "primaryBias: String(r[4] || '')",
              "entry: r[19] === '' ? null : Number(r[19])",
              "tp2: r[22] === '' ? null : Number(r[22])",
              "thesisId: String(r[38] || '')",
              "executionGate: String(r[42] || '')",
          ]
          required_rules = [
              "AGENTE XRPUSDT — XRP_V3.4",
              "Direction Score",
              "Execution Score",
              "ATR STOP STRESS — OPERATIVO",
              "THESIS ID / DEDUPLICACIÓN",
              "DK:DY",
              "Realized R",
          ]
          required_tracker = [
              "EXECUTION_HORIZON_MINUTES = 240",
              "AMBIGUOUS_ENTRY_BAR",
              "AMBIGUOUS_SAME_1M",
              "NO_FILL",
              "realizedR",
          ]

          for item in required_receptor:
              assert item in receptor, f"missing receptor contract: {item}"
          for item in required_rules:
              assert item in rules, f"missing rule contract: {item}"
          for item in required_tracker:
              assert item in tracker, f"missing tracker contract: {item}"
          PY

      - name: Preserve frozen V3.3 paired baseline
        run: |
          git diff --exit-code origin/main...HEAD -- agents/XRP_PAIRED_CURRENT_RUNNER_V1.md
          git diff --exit-code origin/main...HEAD -- agents/XRP_V3_3_MASTER.txt
          git diff --exit-code origin/main...HEAD -- apps-script/XRP_Receptor_Incremental.gs
