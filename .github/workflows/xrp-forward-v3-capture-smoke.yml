name: XRP Forward V3 Capture Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/xrp-forward-v3-capture-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Syntax gate
        run: |
          python -m py_compile             termux/forward_v3_tracker.py             termux/market_collector.py             termux/test_forward_v3_tracker.py

      - name: Apps Script syntax gate
        run: |
          cp apps-script/XRP_Receptor_Incremental.gs /tmp/XRP_Receptor_Incremental.js
          node --check /tmp/XRP_Receptor_Incremental.js

      - name: Run deterministic capture smoke
        env:
          PYTHONPATH: termux
        run: python termux/test_forward_v3_tracker.py
