name: XRP Challenger Independent Collector Prelaunch V2

on:
  workflow_dispatch:
  push:
    paths:
      - "termux/**"
      - "apps-script/XRP_Challenger_Receptor.gs"
      - "apps-script/XRP_Receptor_Incremental.gs"
      - "research/XRP_FORWARD_RESEARCH_PROTOCOL_V3_2.md"
      - "research/XRP_FORWARD_EVALUATION_CONTRACT_V3_2.md"
      - "research/XRP_2026_HOLDOUT_LOCK_V1.md"
      - "research/XRP_CHALLENGER_COLLECTOR_PROTOCOL_V2.md"
      - "research/XRP_CHALLENGER_DEPLOYMENT_GATE_V2.md"
      - "research/experiments/XRP_FORWARD_REGISTRY_V3_2.jsonl"
      - "research/experiments/XRP_FORWARD_EVALUATION_CONTRACT_V3_2.json"
      - "research/experiments/XRP_CHALLENGER_COLLECTOR_REGISTRY_V2.json"
      - "research/validate_xrp_challenger_collector_v2.py"
      - ".gitignore"
      - ".github/workflows/xrp-challenger-independent-collector-v1.yml"
  pull_request:
    paths:
      - "termux/**"
      - "apps-script/XRP_Challenger_Receptor.gs"
      - "apps-script/XRP_Receptor_Incremental.gs"
      - "research/XRP_FORWARD_RESEARCH_PROTOCOL_V3_2.md"
      - "research/XRP_FORWARD_EVALUATION_CONTRACT_V3_2.md"
      - "research/XRP_2026_HOLDOUT_LOCK_V1.md"
      - "research/XRP_CHALLENGER_COLLECTOR_PROTOCOL_V2.md"
      - "research/XRP_CHALLENGER_DEPLOYMENT_GATE_V2.md"
      - "research/experiments/XRP_FORWARD_REGISTRY_V3_2.jsonl"
      - "research/experiments/XRP_FORWARD_EVALUATION_CONTRACT_V3_2.json"
      - "research/experiments/XRP_CHALLENGER_COLLECTOR_REGISTRY_V2.json"
      - "research/validate_xrp_challenger_collector_v2.py"
      - ".gitignore"
      - ".github/workflows/xrp-challenger-independent-collector-v1.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: python -m py_compile termux/forward_v3_tracker.py termux/xrp_challenger_collector.py termux/challenger_deployment_gate.py termux/market_collector.py termux/test_forward_v3_tracker.py termux/test_xrp_challenger_collector_v2.py termux/test_challenger_deployment_gate_v2.py research/validate_xrp_challenger_collector_v2.py

      - name: Shell syntax
        run: bash -n termux/start_challenger_collector.sh && bash -n termux/stop_challenger_collector.sh && bash -n termux/status_challenger_collector.sh

      - name: Apps Script syntax
        run: cp apps-script/XRP_Challenger_Receptor.gs /tmp/xrp_challenger_receptor.js && cp apps-script/XRP_Receptor_Incremental.gs /tmp/xrp_current_receptor.js && node --check /tmp/xrp_challenger_receptor.js && node --check /tmp/xrp_current_receptor.js

      - name: V3.2 tracker parity and regressions
        env:
          PYTHONPATH: termux:research
        run: python termux/test_forward_v3_tracker.py

      - name: Challenger V2 activation and isolation
        env:
          PYTHONPATH: termux
        run: python termux/test_xrp_challenger_collector_v2.py

      - name: Challenger V2 deployment gate
        env:
          PYTHONPATH: termux
        run: python termux/test_challenger_deployment_gate_v2.py

      - name: Validate preregistration and separation
        run: python research/validate_xrp_challenger_collector_v2.py

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: xrp-challenger-independent-collector-prelaunch-v2
          path: challenger-collector-prelaunch-v2/
