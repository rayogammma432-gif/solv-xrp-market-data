name: XRP Paired Benchmark Prelaunch V1
# rerun: 5

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/xrp-paired-benchmark-prelaunch-v1.yml"
      - "research/XRP_PAIRED_BENCHMARK_PROTOCOL_V1.md"
      - "research/XRP_PAIRED_ISOLATION_PROTOCOL_V1.md"
      - "research/XRP_PAIRED_STANDARD_COST_V1.md"
      - "research/XRP_CHALLENGER_CURRENT_COMPARISON_CONTRACT_V1.md"
      - "research/experiments/XRP_PAIRED_BENCHMARK_REGISTRY_DRAFT_V1.json"
      - "research/validate_xrp_paired_benchmark_prelaunch_v1.py"
      - "research/xrp_paired_benchmark_evaluator_v1.py"
      - "research/test_xrp_paired_benchmark_v1.py"
      - "research/test_xrp_paired_snapshot_v1.py"
      - "agents/XRP_CHALLENGER_PAIRED_V1.md"
      - "agents/XRP_PAIRED_CHALLENGER_RUNNER_V1.md"
      - "agents/XRP_PAIRED_CURRENT_RUNNER_V1.md"
      - "agents/XRP_V3_3_MASTER.txt"
      - "termux/market_collector.py"
      - "apps-script/XRP_Receptor_Incremental.gs"
  pull_request:
    paths:
      - ".github/workflows/xrp-paired-benchmark-prelaunch-v1.yml"
      - "research/XRP_PAIRED_BENCHMARK_PROTOCOL_V1.md"
      - "research/XRP_PAIRED_ISOLATION_PROTOCOL_V1.md"
      - "research/XRP_PAIRED_STANDARD_COST_V1.md"
      - "research/XRP_CHALLENGER_CURRENT_COMPARISON_CONTRACT_V1.md"
      - "research/experiments/XRP_PAIRED_BENCHMARK_REGISTRY_DRAFT_V1.json"
      - "research/validate_xrp_paired_benchmark_prelaunch_v1.py"
      - "research/xrp_paired_benchmark_evaluator_v1.py"
      - "research/test_xrp_paired_benchmark_v1.py"
      - "research/test_xrp_paired_snapshot_v1.py"
      - "agents/XRP_CHALLENGER_PAIRED_V1.md"
      - "agents/XRP_PAIRED_CHALLENGER_RUNNER_V1.md"
      - "agents/XRP_PAIRED_CURRENT_RUNNER_V1.md"
      - "agents/XRP_V3_3_MASTER.txt"
      - "termux/market_collector.py"
      - "apps-script/XRP_Receptor_Incremental.gs"

jobs:
  prelaunch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python syntax gate
        run: |
          python -m py_compile \
            research/xrp_paired_benchmark_evaluator_v1.py \
            research/test_xrp_paired_benchmark_v1.py \
            research/test_xrp_paired_snapshot_v1.py \
            research/validate_xrp_paired_benchmark_prelaunch_v1.py

      - name: Apps Script syntax gate
        run: |
          cp apps-script/XRP_Receptor_Incremental.gs /tmp/xrp_receptor.js
          node --check /tmp/xrp_receptor.js

      - name: Validate paired prelaunch design
        run: python research/validate_xrp_paired_benchmark_prelaunch_v1.py

      - name: Run paired snapshot smoke
        env:
          PYTHONPATH: termux
        run: python research/test_xrp_paired_snapshot_v1.py

      - name: Run synthetic paired evaluator smoke
        run: python research/test_xrp_paired_benchmark_v1.py

      - name: Upload prelaunch validation
        uses: actions/upload-artifact@v4
        with:
          name: xrp-paired-benchmark-prelaunch-v1
          path: paired-prelaunch/
