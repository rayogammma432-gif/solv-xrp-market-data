name: XRP BTC Derivatives Audit V1

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/xrp-btc-derivatives-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run derivatives archive audit
        run: python research/historical_derivatives_audit.py
      - name: Upload derivatives audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xrp-btc-derivatives-audit-v1
          path: audit-output/
          if-no-files-found: warn
